<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinplore Glass · Explore View</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#vp{position:relative;width:1210px;height:834px;overflow:hidden;flex:none;transform-origin:center}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
img{display:block}
#bg{width:1351px;height:900px}
.shell{position:absolute;pointer-events:none}
#headS{left:496px;top:31px;width:219px;height:64px;border-radius:999px;background:rgba(0,0,0,.3);
  backdrop-filter:blur(5.2px);-webkit-backdrop-filter:blur(5.2px);box-shadow:0 4.1px 20.7px rgba(0,0,0,.1)}
#head{left:496px;top:31px;width:219px;height:64px}
.pinS{border-radius:999px;backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px)}
#filterS{width:53.8px;height:239px;border-radius:133px;background:rgba(255,255,255,.3);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px)}
/* Figma: metrics + filter rail sit in one group with Screen blend */
#filterS,#metrics{mix-blend-mode:screen}
@font-face{font-family:Manrope;font-weight:400;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
/* right-side metrics as live text (Figma: 120 wide, 24 gap, value 25.9 Montserrat Bold, label 8 Manrope +6%) */
#metrics{width:120px;padding-top:28px;display:flex;flex-direction:column;gap:24px;text-align:right;color:#fff}
#metrics b{display:block;font:700 25.89px/30px Montserrat,sans-serif}
#metrics small{display:block;margin-top:3px;font:400 7.97px/11px Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#d1d1d1}
#cardS{width:337px;height:482.5px;border-radius:15.7px;backdrop-filter:blur(23px);-webkit-backdrop-filter:blur(23px);box-shadow:0 0 118px rgba(0,0,0,.25)}
#card{width:337px;height:482.5px}
#shade{width:683px;height:834px;background:linear-gradient(to right,rgba(0,0,0,.5),rgba(0,0,0,0))}
#column{width:262px;height:800px}
.touch{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:999px;background:rgba(255,255,255,.35);
  border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.12),0 2px 10px rgba(0,0,0,.2);opacity:0;pointer-events:none;z-index:50}
</style>
</head>
<body>
<div id="vp">
  <img id="bg" class="abs" src="assets/bg.jpg" alt="">
  <video id="walk" class="abs" muted playsinline preload="auto" style="transform-origin:0 0"><source src="assets/bgwalk.mp4" type="video/mp4"><source src="assets/bgwalk.webm" type="video/webm"></video>
  <div id="pins"></div>
  <div id="shade" class="abs"></div>
  <div id="filterS" class="shell abs"></div>
  <div id="metrics" class="abs"><div><b>1.2km</b><small>Total Range</small></div><div><b>89</b><small>Impact Pins</small></div><div><b>HOT</b><small>Total Range</small></div></div>
  <div id="headS" class="shell abs"></div><img id="head" class="abs" src="assets/head.png" alt="">
  <div id="cardS" class="shell abs"></div><img id="card" class="abs" src="assets/card.png" alt="">
  <img id="column" class="abs" src="assets/column.png" alt="">
  <div id="tap" class="abs touch"></div>
  <div id="drag" class="abs touch"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eout=k=>1-Math.pow(1-k,3);
const CAPTURE=new URLSearchParams(location.search).has('capture');
const SCENE=1;

/* Figma iPad frames (1210×834). Pins are anchored to the street: they get the exact same shift as the photo. */
const BG0={x:-70,y:-34}, SHIFT={x:42,y:-32};
const PINS=[{x:595,y:439,w:55},{x:288,y:247,w:35},{x:114,y:668,w:42},{x:713,y:200,w:38},{x:931,y:316,w:54}];
const PIN_OPEN=69, METRICS={x:1062,y:310}, FILTER_DX=141.4, CARD={x:265,y:248}, COL={x:39,y:89};

/* walk-in intro: real footage walks up to this exact framing, then the UI appears */
const INTRO=5.0, VID={x:40.96,y:10.41,w:1290.06,rot:-0.357};     // walk-in end frame aligned onto bg (SIFT fit)
/* the footage then holds and glances down-left (Seedance extension). Pins ride on it: per-frame
   viewport similarity [a,b,tx,ty] tracked from the clip (SIFT, smoothed), starting at EXT0 in the clip. */
const EXT0=5.0417+1.1, TRACK=[[1.0,-0.0,0.0,0.0],[0.99991,1e-05,0.25,0.18],[0.99985,3e-05,0.43,0.27],[0.99978,6e-05,0.62,0.37],[0.9997,0.0001,0.78,0.44],[0.99959,0.00012,0.96,0.51],[0.99949,0.00016,1.12,0.57],[0.99939,0.00019,1.28,0.62],[0.9993,0.00021,1.44,0.67],[0.99919,0.00025,1.66,0.71],[0.99911,0.00029,1.87,0.74],[0.99905,0.00032,2.07,0.75],[0.99897,0.00035,2.29,0.77],[0.9989,0.00037,2.55,0.78],[0.99886,0.00037,2.77,0.8],[0.99881,0.00038,3.01,0.82],[0.99876,0.00038,3.25,0.84],[0.99873,0.00038,3.51,0.85],[0.99871,0.00038,3.74,0.85],[0.99868,0.00038,3.97,0.84],[0.99862,0.00038,4.19,0.82],[0.99858,0.00035,4.43,0.75],[0.99858,0.00034,4.61,0.62],[0.99855,0.00033,4.8,0.44],[0.99855,0.00031,4.96,0.22],[0.99854,0.00031,5.14,-0.11],[0.99852,0.00031,5.27,-0.47],[0.99846,0.0003,5.4,-0.84],[0.99842,0.00027,5.5,-1.27],[0.99836,0.00025,5.61,-1.87],[0.99837,0.00024,5.66,-2.49],[0.99837,0.00023,5.71,-3.16],[0.99839,0.00022,5.75,-3.93],[0.99844,0.00021,5.79,-4.93],[0.99847,0.00019,5.82,-5.91],[0.99848,0.00017,5.84,-6.96],[0.99854,0.00015,5.84,-8.14],[0.99855,0.00015,5.88,-9.6],[0.9986,0.00019,5.9,-11.01],[0.99883,0.0002,5.76,-12.53],[0.99892,0.00022,5.72,-14.08],[0.99899,0.00028,5.72,-15.92],[0.99936,0.0003,5.51,-17.73],[0.99974,0.00027,5.26,-19.61],[0.99951,0.00034,5.47,-21.28],[1.00012,0.00034,5.15,-23.71],[1.00037,0.00033,5.07,-25.81],[1.00044,0.00039,5.14,-27.93],[1.00054,0.00055,5.26,-30.21],[1.00065,0.00059,5.31,-32.8],[1.00063,0.00095,5.58,-35.33],[1.00013,0.00104,6.01,-37.42],[0.99948,0.00105,6.49,-39.42],[0.99912,0.00094,6.76,-41.81],[0.99853,0.00082,7.11,-43.81],[0.99776,0.0006,7.59,-45.6],[0.99822,0.00062,7.41,-48.2],[0.99888,0.00066,7.18,-51.24],[0.99893,0.00074,7.32,-53.68],[0.99901,0.00098,7.64,-56.2],[0.99959,0.00102,7.46,-58.8],[0.99956,0.00108,7.75,-61.43],[0.99953,0.00113,8.01,-63.72],[0.9998,0.00116,8.09,-66.09],[1.00062,0.00114,7.74,-68.74],[1.00039,0.00112,8.11,-71.08],[1.0004,0.00112,8.3,-73.15],[1.00058,0.00114,8.42,-75.22],[1.00071,0.00118,8.59,-77.19],[1.00072,0.00124,8.89,-79.22],[1.00092,0.00131,9.07,-81.05],[1.0008,0.00138,9.4,-82.64],[1.00065,0.00143,9.77,-84.18],[1.00046,0.00148,10.22,-85.78],[1.00056,0.00147,10.46,-87.21],[0.99947,0.00148,11.44,-87.93],[0.99965,0.00152,11.65,-89.28],[0.99983,0.00159,11.94,-90.67],[0.99998,0.00165,12.17,-91.83],[1.00019,0.00174,12.39,-92.96],[1.00167,0.00182,11.8,-94.7],[1.00168,0.00189,12.17,-95.76],[1.00161,0.00181,12.53,-96.47],[1.00146,0.00183,12.94,-97.14],[1.00083,0.00184,13.62,-97.55],[1.0003,0.00187,14.27,-98.04],[1.00026,0.00192,14.69,-98.58],[1.00023,0.00205,15.07,-99.17],[1.00049,0.00211,15.3,-99.81],[1.00092,0.00215,15.49,-100.55],[1.00111,0.00221,15.8,-101.08],[1.00069,0.00223,16.39,-101.26],[1.00041,0.00224,16.88,-101.45],[0.99978,0.0023,17.69,-101.54],[0.99931,0.00239,18.38,-101.6],[0.99915,0.0024,18.91,-101.78],[0.99947,0.00242,19.13,-102.17],[0.99975,0.00237,19.47,-102.51],[0.99948,0.00231,19.99,-102.49],[0.99986,0.0023,20.11,-102.79],[0.99946,0.00235,20.77,-102.71],[0.99915,0.00234,21.36,-102.65],[0.99879,0.00247,21.96,-102.59],[0.99953,0.00249,21.96,-103.03],[0.99922,0.00251,22.53,-102.95],[0.99856,0.0025,23.27,-102.67],[0.99739,0.00251,24.42,-102.11],[0.99706,0.00256,24.97,-102.02],[0.9964,0.00263,25.7,-101.76],[0.99645,0.00265,26.06,-101.81],[0.99614,0.00267,26.6,-101.68],[0.99701,0.00278,26.43,-102.2],[0.99726,0.00272,26.52,-102.3],[0.99675,0.00264,27.06,-102.03],[0.99737,0.00265,26.91,-102.35],[0.99811,0.00261,26.63,-102.72],[0.99847,0.00253,26.59,-102.85],[0.99772,0.00254,27.26,-102.52],[0.99766,0.00259,27.48,-102.54],[0.9962,0.00255,28.45,-101.82]];
function track(vt){const f=(vt-EXT0)*24; if(f<=0)return [1,0,0,0]; const i=Math.min(TRACK.length-1,Math.floor(f)),j=Math.min(TRACK.length-1,i+1),u=Math.min(1,f-i);
  return TRACK[i].map((v,n)=>v+(TRACK[j][n]-v)*u)}
const at=(T,x,y)=>[T[0]*x-T[1]*y+T[2],T[1]*x+T[0]*y+T[3]];
const S1=(o=>({tap:1.2+o, cardIn:[1.4+o,1.95+o], look:[1.5+o,2.7+o], cardOut:[4.4+o,5.1+o], swipe:[6.0+o,7.1+o], end:9.4+o}))(INTRO+0.6);   // card stays a while, folds back into its pin, pause, then the list
const S2={swipe:[1.0,1.9], end:3.6};
const DUR=S1.end;

const pinEls=PINS.map((p,i)=>{
  const s=document.createElement('div');s.className='shell pinS abs';
  const im=document.createElement('img');im.className='abs';im.src=`assets/pin${i}.png`;im.style.borderRadius='999px';
  $('pins').append(s,im);return [s,im];
});
const tr=(el,x,y,extra='')=>{el.style.transform=`translate(${x}px,${y}px)${extra}`};

function apply(t){
  let sh=0,mx=0,colX=-300,shade=0,cardK=0,grow=0;
  /* open a pin → look down → close the card → swipe in the nearby-pin list */
  sh=eio(prog(t,...S1.look));
  const close=eio(prog(t,...S1.cardOut));
  const open=eout(prog(t,...S1.cardIn));
  cardK=open;
  grow=eout(prog(t,S1.tap,S1.tap+.35))*(1-eio(prog(t,S1.cardOut[1]-.15,S1.cardOut[1]+.25)));
  const sw=eio(prog(t,...S1.swipe));
  mx=lerp(120*eio(prog(t,...S1.cardIn))*(1-eio(prog(t,S1.cardOut[1]-.2,S1.cardOut[1]+.4))),160,sw); colX=lerp(-300,COL.x,sw); shade=sw;
  /* gaze now comes from the footage: pins follow the tracked camera instead of a code shift */
  const wv=$('walk'), vt=(playing&&wv.duration&&!wv.paused)?wv.currentTime:t, T=track(vt);
  tr($('bg'),BG0.x,BG0.y);
  /* Figma: while one pin is open, the other pins drop to 50% */
  const dim=open*(1-close);
  PINS.forEach((p,i)=>{const w=(i===0?lerp(p.w,PIN_OPEN,grow):p.w)*T[0], [cx,cy]=at(T,p.x+p.w/2,p.y+p.w/2);
    const ap=eout(prog(t,INTRO+.05+i*.09,INTRO+.4+i*.09)); pinEls[i].forEach(el=>{el.style.width=el.style.height=w+'px';tr(el,cx-w/2,cy-w/2,` scale(${lerp(.6,1,ap)})`);el.style.opacity=ap*(i===0?1:lerp(1,.5,dim))})});
  tr($('metrics'),METRICS.x+mx,METRICS.y); tr($('filterS'),METRICS.x+FILTER_DX+mx,METRICS.y);
  const railIn=eout(prog(t,INTRO+.2,INTRO+.7)); $('metrics').style.opacity=railIn; $('filterS').style.opacity=railIn;
  /* footage stays on for the whole flow (still image underneath only as a fallback) */
  wv.style.width=VID.w+'px';
  wv.style.transform=`translate(${BG0.x+VID.x}px,${BG0.y+VID.y}px) rotate(${VID.rot}deg)`;
  syncWalk(t);
  /* card grows out of its pin and folds back into it (window-close motion) */
  const p0=PINS[0], [p0x,p0y]=at(T,p0.x+p0.w/2,p0.y+p0.w/2), ox=p0x-CARD.x, oy=p0y-CARD.y;
  const k=Math.max(0,Math.min(1,(close-0)/1)), sc=lerp(.82,1,open)*lerp(1,.06,k), op=open*(1-prog(k,.55,1));
  ['cardS','card'].forEach(id=>{const el=$(id); el.style.opacity=op; el.style.visibility=op>0?'visible':'hidden';
    el.style.transformOrigin=`${ox}px ${oy}px`; tr(el,CARD.x,CARD.y,` scale(${sc})`)});
  $('shade').style.opacity=shade; tr($('column'),colX,COL.y); $('column').style.visibility=sw>0?'visible':'hidden';
  const tp=$('tap'),dg=$('drag');
  tp.style.opacity=0; dg.style.opacity=0;
  for(const [t0,x,y] of [[S1.tap,PINS[0].x+PINS[0].w/2,PINS[0].y+PINS[0].w/2]]){
    const q=prog(t,t0,t0+.45); if(t>=t0&&q<1){tp.style.opacity=1-q;tr(tp,x+(t0===S1.tap?0:SHIFT.x*sh*0),y,` scale(${.5+.7*q})`)}}
  if(t>=S1.swipe[0]-.15&&t<S1.swipe[1]+.2){dg.style.opacity=prog(t,S1.swipe[0]-.15,S1.swipe[0])*(1-prog(t,S1.swipe[1],S1.swipe[1]+.2));tr(dg,lerp(28,330,sw),417);}
}
function syncWalk(t){const v=$('walk'); if(!v||!v.duration)return;
  const want=Math.min(t,v.duration-.05);
  if(t>=v.duration-.05){if(!v.paused)v.pause();if(Math.abs(v.currentTime-want)>.05)v.currentTime=want;return}
  if(playing){ if(v.paused){v.currentTime=want;v.play().catch(()=>{})} else if(Math.abs(v.currentTime-want)>.25) v.currentTime=want; }
  else { if(!v.paused)v.pause(); if(Math.abs(v.currentTime-want)>.03) v.currentTime=want; }}
function fit(){if(CAPTURE)return;const s=Math.min(innerWidth/1210,innerHeight/834);$('vp').style.transform=`scale(${s})`}
addEventListener('resize',fit);
async function boot(){
  try{await Promise.all([document.fonts.load('700 12px Montserrat'),document.fonts.load('400 12px Manrope')])}catch(e){}
  await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  await new Promise(r=>{const v=$('walk');if(v.readyState>=3)return r();v.addEventListener('canplaythrough',r,{once:true});v.addEventListener('error',r,{once:true});setTimeout(r,6000)});
  fit();apply(0);window.__ready=true;if(!CAPTURE&&!/[?&]embed/.test(location.search))setTimeout(play,500);
}
window.__seek=t=>apply(t);window.__DUR=DUR;
let playing=false,t0=0,tNow=0;
let raf=0;
function play(){cancelAnimationFrame(raf);playing=true;t0=performance.now()-tNow*1000;raf=requestAnimationFrame(loop)}
function loop(now){if(!playing)return;tNow=Math.max(0,(now-t0)/1000);if(tNow>=DUR){tNow=DUR;apply(DUR);playing=false;return}apply(tNow);raf=requestAnimationFrame(loop)}
/* shell control: the showcase drives playback in persistent frames */
window.__restart=()=>{playing=false;cancelAnimationFrame(raf);tNow=0;apply(0);play()};
window.__pause=()=>{playing=false;cancelAnimationFrame(raf);try{$('walk').pause()}catch(e){}};
window.__resume=()=>{if(!playing&&tNow<DUR)play()};
window.__t=()=>tNow;
/* fallback channel when the shell can't reach this frame directly (opened from file://) */
if(/[?&]embed/.test(location.search)){
  const st=document.createElement('style');st.textContent='#head,#headS,#headA,#headAimg{visibility:hidden!important}';document.head.appendChild(st);
  addEventListener('message',e=>{const c=e.data&&e.data.pp;if(c&&typeof window['__'+c]==='function')window['__'+c]()});
  setInterval(()=>{try{const h=document.getElementById('head')||document.getElementById('headA');
    parent.postMessage({ppT:tNow,ppDur:DUR,ppReady:!!window.__ready,ppHead:h&&h.style.opacity!==''?+h.style.opacity:1},'*')}catch(e){}},50);
}
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(playing)playing=false;else{if(tNow>=DUR)tNow=0;play()}}
  if(e.key==='r'||e.key==='R'){tNow=0;apply(0);playing=false;setTimeout(play,400)}
});
boot();
</script>
</body>
</html>
