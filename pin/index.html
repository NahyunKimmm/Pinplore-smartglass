<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinplore Glass · Drop a Pin</title>
<style>
@font-face{font-family:Manrope;font-weight:400;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:600;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
:root{--green:#5bff3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#vp{position:relative;width:1210px;height:834px;overflow:hidden;flex:none;transform-origin:center}
#stage{position:absolute;left:0;top:2px;width:1536px;height:832px;overflow:visible;transform-origin:0 0;
  font-family:Manrope,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:absolute;left:0;top:0;width:1536px;height:832px;display:block}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}

/* glass rim (Figma GLASS light angle -45°) */
.rim::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.12) 32%,rgba(255,255,255,.04) 55%,rgba(255,255,255,.10) 75%,rgba(255,255,255,.42));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* ---------- Category card (1892:62555) ---------- */
#cat{left:97px;top:270px;display:flex;flex-direction:column;gap:12.486px;align-items:flex-start;
  padding:39.54px 22.892px;border-radius:57.52px;background:rgba(0,0,0,.2);
  backdrop-filter:blur(49px) saturate(1.15);-webkit-backdrop-filter:blur(49px) saturate(1.15);
  box-shadow:inset 0 1px 18px rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.12)}
.cbadge{position:relative;display:flex;align-items:center;gap:12.868px;width:209.191px;height:54.349px;
  padding:0 20.22px 0 25.16px;border:1.702px solid transparent;border-radius:999px;
  background:rgba(0,0,0,.2);backdrop-filter:blur(17.023px);-webkit-backdrop-filter:blur(17.023px)}
.cbadge img{display:block;flex:none}
.cbadge span{font-weight:600;font-size:17.023px;line-height:16.648px;text-transform:uppercase;white-space:nowrap;color:rgba(255,255,255,.7)}
.cbadge .hov{position:absolute;inset:-1.702px;border-radius:999px;background:rgba(255,255,255,.14);opacity:0;pointer-events:none}
.cbadge .sel{position:absolute;inset:-1.702px;border-radius:999px;opacity:0;pointer-events:none}
.cbadge .sel::before{content:"";position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.2)}
.cbadge .sel::after{content:"";position:absolute;inset:0;border-radius:999px;padding:1.702px;
  background:linear-gradient(90deg,#34db12,#e8f000);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.cbadge img,.cbadge span{position:relative;z-index:1}
#b-scenery .lbl{color:rgba(255,255,255,.7)}

/* ---------- Pin (Pin instance) ---------- */
#pin{width:96.551px;height:96.551px;border-radius:999px;background:#fff;overflow:hidden;
  box-shadow:0 0 20.298px 0 var(--green),inset 0 2px 3px rgba(255,255,255,1),inset 0 -4px 8px rgba(0,0,0,.10),inset 2px 2px 6px rgba(255,255,255,.9)}
#pin .blob{position:absolute;left:10.97px;top:10.97px;width:74.608px;height:74.608px;border-radius:999px;
  background:linear-gradient(45deg,#6cee52 0%,#e8f000 100%);filter:blur(8.265px);
  box-shadow:0 15.543px 23.315px -2.898px rgba(0,0,0,.1),0 6.217px 9.326px -3.864px rgba(0,0,0,.1)}
#pin img{position:absolute;left:50%;top:calc(50% + .67px);width:39.059px;height:40.26px;transform:translate(-50%,-50%)}
#pinGlow{width:96.551px;height:96.551px;border-radius:999px;pointer-events:none}
.ring{width:96.551px;height:96.551px;border-radius:999px;border:2px solid rgba(91,255,58,.9);pointer-events:none;opacity:0}

/* ---------- Note card (1892:62473 / 62720) ---------- */
#note{left:295px;top:175px;width:635.33px;border-radius:30.334px;overflow:hidden;background:rgba(0,0,0,.2);
  backdrop-filter:blur(30px) saturate(1.1);-webkit-backdrop-filter:blur(30px) saturate(1.1);
  box-shadow:inset 0 0 0 .758px rgba(255,255,255,.15),0 20px 50px rgba(0,0,0,.12);display:flex;flex-direction:column}
#note .top{display:flex;justify-content:center;padding:24.267px 24.267px 12.134px}
#note .tbadge{display:flex;align-items:center;gap:9.536px;padding:11.92px 21.456px 10.728px;border-radius:999px;background:#454545}
#note .tbadge span{font-weight:600;font-size:19.787px;line-height:19.352px;color:#fff;text-transform:uppercase;white-space:nowrap}
#note .body{display:flex;flex-direction:column;gap:23.84px;align-items:center;padding:23.84px}
.ethereal{position:relative;width:100%;height:286.077px;background:rgba(0,0,0,.2);border-radius:25.206px;overflow:hidden;
  padding:22.264px 23.378px;display:flex;flex-direction:column;justify-content:space-between}
.tarea{position:relative;flex:1;padding-top:8.247px}
.tarea .ph{font-weight:400;font-size:21.456px;line-height:1.4;color:#d1d1d1;width:539.971px}
.tarea .typed{position:absolute;left:0;top:8.247px;width:100%;font-weight:600;font-size:21.549px;line-height:1.4;color:#fff}
.tarea .typed .w{opacity:0}
.tarea .typed .caret{font-weight:600;position:absolute;left:0;top:0;pointer-events:none}
.ghost{position:absolute;left:0;right:.24px;bottom:.07px;height:1.031px;background:linear-gradient(90deg,rgba(69,72,79,0),rgba(69,72,79,.3),rgba(69,72,79,0))}
.actions{display:flex;align-items:center;justify-content:space-between}
.actions .l{display:flex;gap:8.247px}
.chip{position:relative;display:flex;align-items:center;justify-content:center;height:46.488px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.chip.sq{width:46.488px}
.chip img{width:28.608px;height:28.608px;display:block;flex:none}
#dict{gap:7.152px;padding:0 19.072px;transition:none}
#dict .lbl{font-weight:600;font-size:17.88px;line-height:1.4;color:#fff;white-space:nowrap}
#dict .hov,#drop .hov{position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.18);opacity:0}
#dict .icw{position:relative;width:28.608px;height:28.608px;flex:none}
#dict .icw img{position:absolute;inset:0}
#drop{position:relative;width:100%;display:flex;justify-content:center;align-items:center;padding:21.456px 17.88px;border-radius:38.144px;background:rgba(255,255,255,.8);overflow:hidden}
#drop span{position:relative;font-family:Montserrat,sans-serif;font-weight:700;font-size:19.072px;line-height:1.4;letter-spacing:-.3814px;color:#1c1c1c;white-space:nowrap}
#drop .hov{background:rgba(255,255,255,.6)}

/* ---------- Touch indicator (same as mobile prototype) ---------- */
.touch{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:999px;background:rgba(255,255,255,.35);
  border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.12),0 2px 10px rgba(0,0,0,.2);opacity:0;pointer-events:none;z-index:50}
#ctl{position:fixed;left:14px;bottom:12px;font:500 12px/1.4 Manrope,sans-serif;color:rgba(255,255,255,.45)}
body.capture #ctl{display:none}
</style>
</head>
<body>
<div id="vp"><div id="stage">
  <img id="bg" src="assets/bg.jpg" alt="">

  <!-- Category card -->
  <div id="cat" class="abs rim">
    <div class="cbadge" id="b-scenery"><div class="sel"></div>
      <img src="assets/ic-scenery.png" style="width:21.977px;height:23.397px" alt=""><span class="lbl">scenery</span></div>
    <div class="cbadge" id="b-persp"><div class="sel"></div>
      <img src="assets/ic-perspective.png" style="width:22.512px;height:20.811px" alt=""><span>Perspective</span></div>
    <div class="cbadge" id="b-info" style="height:53.323px;width:210.217px"><div class="sel"></div>
      <img src="assets/ic-info.png" style="width:20.81px;height:20.81px" alt=""><span>Information</span></div>
    <div class="cbadge" id="b-tip"><div class="sel"></div>
      <img src="assets/ic-tip.png" style="width:15.845px;height:20.81px" alt=""><span>Tip / Idea</span></div>
  </div>

  <!-- Note card -->
  <div id="note" class="abs rim">
    <div class="top"><div class="tbadge"><img src="assets/ic-badge.png" style="width:25.546px;height:27.197px" alt=""><span>scenery</span></div></div>
    <div class="body">
      <div class="ethereal">
        <div class="tarea">
          <p class="ph" id="ph">Your note will be visible to everyone in this location.</p>
          <p class="typed" id="typed"></p>
          <div class="ghost"></div>
        </div>
        <div class="actions">
          <div class="l">
            <div class="chip sq"><img src="assets/ic-image.png" alt=""></div>
            <div class="chip sq"><img src="assets/ic-camera.png" alt=""></div>
            <div class="chip sq"><img src="assets/ic-music.png" alt=""></div>
          </div>
          <div class="chip" id="dict">
            <div class="icw"><img id="micIdle" src="assets/ic-mic.png" alt=""><img id="micSpin" src="assets/ic-micActive.png" alt="" style="opacity:0"></div>
            <span class="lbl" id="dictLbl">Dictate</span></div>
        </div>
      </div>
      <div id="drop"><span>Drop Pin</span></div>
    </div>
  </div>

  <!-- Pin -->
  <div id="pin" class="abs"><div class="blob"></div><img src="assets/ic-pinIcon.png" alt=""></div>
  <div id="tap" class="abs touch"></div>
  <div id="drag" class="abs touch"></div>
</div><div id="headS" style="position:absolute;left:496px;top:31px;width:219px;height:64px;border-radius:999px;background:rgba(0,0,0,.3);backdrop-filter:blur(5.2px);-webkit-backdrop-filter:blur(5.2px);box-shadow:0 4px 21px rgba(0,0,0,.1);z-index:40"></div><img id="head" src="assets/headPin.png" alt="" style="position:absolute;left:496px;top:31px;width:219px;height:64px;z-index:41"></div>


<script src="timeline.js"></script>
</body>
</html>
