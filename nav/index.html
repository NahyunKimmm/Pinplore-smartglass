<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinplore Glass · Collection to Navigation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#vp{position:relative;width:1210px;height:834px;overflow:hidden;flex:none;transform-origin:center}
#stage{position:absolute;left:0;top:0;width:1920px;height:878px}
.grp{position:absolute;left:0;top:0;width:1920px;height:878px;transform-origin:0 0}
#bg,#bgSharp{position:absolute;left:0;top:0;width:1210px;height:834px;display:block}
#bgSharp{opacity:0}
.abs{position:absolute;will-change:transform,opacity}
img{display:block}

/* glass shell = Figma GLASS (frost ≈ radius/2) + fill + 15% white stroke + light rim (-45°) */
.shell{position:absolute;pointer-events:none}
.shell::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.1) 30%,rgba(255,255,255,.03) 55%,rgba(255,255,255,.08) 75%,rgba(255,255,255,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.content{position:absolute;overflow:hidden}

/* ---- frame 1/2 ---- */
#headA.shell{left:845px;top:21.9px;width:229.9px;height:67.2px;border-radius:999px;background:rgba(0,0,0,.3);
  backdrop-filter:blur(5.4px);-webkit-backdrop-filter:blur(5.4px);box-shadow:0 4.34px 21.69px rgba(0,0,0,.1)}
#headAimg{left:845px;top:21.9px;width:229.9px;height:67.2px}
#leftS{left:395.4px;top:146px;width:324.5px;height:631px;border-radius:33.74px;background:rgba(0,0,0,.2);
  backdrop-filter:blur(33px);-webkit-backdrop-filter:blur(33px);box-shadow:inset 0 0 0 .84px rgba(255,255,255,.15)}
#leftC{left:395.4px;top:146px;width:324.5px;height:631px;border-radius:33.74px}
#leftC img{width:325px;height:631px}
#rightS{left:736.6px;top:146px;width:735px;height:631px;border-radius:28.47px;background:rgba(0,0,0,.2);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:inset 0 0 0 .71px rgba(255,255,255,.15)}
#rightC{left:736.6px;top:146px;width:735px;height:631px;border-radius:28.47px}
#mapBox{position:absolute;left:0;top:68.85px;width:735px;height:335.6px;overflow:hidden}
#mapImg{position:absolute;left:-2.24px;width:738px;height:485px;mix-blend-mode:lighten}
#pins{position:absolute;left:153.41px;width:416px;height:298px}
#mapLabel{position:absolute;left:418.67px;width:97px;height:26px}
#list{position:absolute;left:0;width:736px;height:739px}
#tabs{position:absolute;left:0;top:0;width:736px;height:69px}

/* ---- frame 3 ---- */
#headB.shell{left:815px;top:17.2px;width:66.7px;height:66.7px;border-radius:999px;background:rgba(0,0,0,.3);
  backdrop-filter:blur(5.4px);-webkit-backdrop-filter:blur(5.4px);box-shadow:0 4.3px 21.5px rgba(0,0,0,.1)}
#headBimg{left:815px;top:17.2px;width:67px;height:67px}
#pillS{left:892.5px;top:17.4px;width:211.7px;height:66.7px;border-radius:107.6px;background:rgba(0,0,0,.3);
  backdrop-filter:blur(26.7px);-webkit-backdrop-filter:blur(26.7px);box-shadow:inset 0 0 0 .68px rgba(255,255,255,.15)}
#pillImg{left:892.5px;top:17.4px;width:212px;height:67px}
#floorS{display:none}
#gFloor{mix-blend-mode:screen}
#floorImg{left:828px;top:553px;width:264px;height:245px;border-radius:25.45px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}

/* ---- frame 4 ---- */
#dayS{left:478px;top:150.4px;width:435px;height:390px;border-radius:25.45px;background:rgba(0,0,0,.2);
  backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:inset 0 0 0 .64px rgba(255,255,255,.15)}
#dayImg{left:478px;top:150.4px;width:435px;height:390px}
#navS{left:926px;top:150px;width:516px;height:577.5px;border-radius:25.45px;background:rgba(0,0,0,.2);
  backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:inset 0 0 0 .64px rgba(255,255,255,.15)}
#navImg{left:926px;top:150px;width:516px;height:578px}

/* touch indicator (same as the mobile prototype) */
.touch{left:0;top:0;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:999px;background:rgba(255,255,255,.35);
  border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.12),0 2px 10px rgba(0,0,0,.2);opacity:0;pointer-events:none;z-index:50}
#ctl{position:fixed;left:14px;bottom:12px;font:500 12px/1.4 sans-serif;color:rgba(255,255,255,.45)}
body.capture #ctl{display:none}
</style>
</head>
<body>
<div id="vp">
  <img id="bg" src="assets/bg_blur.jpg" alt="">
  <img id="bgSharp" src="assets/bg_sharp.jpg" alt="">
<div id="stage">

  <!-- Frame 1 / 2 : My Collection + AI Itinerary -->
  <div class="grp" id="gHeadA"><div id="headA" class="shell abs"></div><img id="headAimg" class="abs" src="assets/head1.png" alt=""></div>
<div class="grp" id="g12">
  <div id="leftS" class="shell abs"></div>
  <div id="leftC" class="content abs"><img src="assets/left.png" alt=""></div>
  <div id="rightS" class="shell abs"></div>
  <div id="rightC" class="content abs">
    <div id="mapBox">
      <img id="mapImg" src="assets/map.png" alt="">
      <img id="pins" src="assets/pins.png" alt="">
      <img id="mapLabel" src="assets/label.png" alt="">
    </div>
    <img id="list" src="assets/list.png" alt="">
    <img id="tabs" src="assets/tabs.png" alt="">
  </div>
</div>

  <!-- Frame 3 : walking navigation -->
  <div class="grp" id="gFloor"><div id="floorS" class="shell abs"></div><img id="floorImg" class="abs" src="assets/floor.png" alt=""></div>
  <div class="grp" id="gTop3"><div id="headB" class="shell abs"></div><img id="headBimg" class="abs" src="assets/head3.png" alt="">
  <div id="pillS" class="shell abs"></div><img id="pillImg" class="abs" src="assets/pill.png" alt=""></div>

  <!-- Frame 4 : navigation detail -->
  <div class="grp" id="g4"><div id="dayS" class="shell abs"></div><img id="dayImg" class="abs" src="assets/dayPanel.png" alt="">
  <div id="navS" class="shell abs"></div><img id="navImg" class="abs" src="assets/navPanel.png" alt=""></div>

  <div id="tap" class="abs touch"></div>
  <div id="drag" class="abs touch"></div>
</div></div>


<script>
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eout=k=>1-Math.pow(1-k,3);
const CAPTURE=new URLSearchParams(location.search).has('capture');
if(CAPTURE)document.body.classList.add('capture');

/* timing (s) */
const T={
  scroll:[1.3,2.3],      // drag up on the itinerary → map collapses, list scrolls (frame 1 → 2)
  navTap:3.3,            // tap the navigation button on the Jangsa Port card (arrow 1)
  f12Out:[3.5,3.9],
  f3In:[3.85,4.35],
  pillTap:5.9,           // tap the "Jangsa Port" pill (arrow 2)
  f3Out:[6.1,6.45],
  f4In:[6.4,6.9],
  end:8.6
};
const DUR=T.end;
const S12=0.9516, SH=219/229.9, S3=63/66.7;
const G={gHeadA:[496-845*SH,31-21.9*SH,SH], g12:[93-395.4*S12,149-146*S12,S12], gTop3:[469-815*S3,31-17.2*S3,S3], gFloor:[-355,-10,1], g4:[(1210-964*S12)/2-478*S12,149-150*S12,S12]};
for(const [id,[x,y,k]] of Object.entries(G)) document.getElementById(id).style.transform=`translate(${x}px,${y}px) scale(${k})`;
const M=(g,p)=>{const [x,y,k]=G[g];return {x:x+p.x*k,y:y+p.y*k}};
const NAV_BTN0={x:1381.6,y:680.6};   // Figma: black route button, frame 2
const PILL0={x:998.3,y:50.7};
const NAV_BTN=M('g12',NAV_BTN0), PILL=M('gTop3',PILL0);        // Figma: destination pill, frame 3
const SCROLL_FROM=M('g12',{x:1150,y:735}), SCROLL_TO=M('g12',{x:1150,y:578});

function setO(ids,o,dy=0){ids.forEach(id=>{const e=$(id);e.style.opacity=o;e.style.transform=dy?`translateY(${dy}px)`:'none'})}

function apply(t){
  /* scroll: map 335.6 → 179, map content -21.2, list 404.85 → 247.85 */
  const k=eio(prog(t,...T.scroll));
  $('mapBox').style.height=lerp(335.64,179.0,k)+'px';
  const sh=-82*k;   // map content pulled up so pins 5·2·6·3 sit in the collapsed map
  $('mapImg').style.top=(335.64-484.44+0.44+sh)+'px';
  $('pins').style.top=(40.72-20+sh)+'px';
  $('mapLabel').style.top=(40.71-2+sh)+'px';
  $('mapLabel').style.opacity=1-prog(t,T.scroll[0],T.scroll[0]+.45);
  $('list').style.top=lerp(404.49,247.85,k)+'px';

  /* frame 1/2 out, frame 3 in/out, frame 4 in */
  const a=1-eout(prog(t,...T.f12Out));
  setO(['headA','headAimg','leftS','leftC','rightS','rightC'],a,(1-a)*8);
  const b=eout(prog(t,...T.f3In))*(1-eout(prog(t,...T.f3Out)));
  setO(['headB','headBimg','pillS','pillImg'],b);
  setO(['floorS','floorImg'],b,(1-eout(prog(t,...T.f3In)))*14);
  const c=eout(prog(t,...T.f4In));
  setO(['dayS','dayImg','navS','navImg'],c,(1-c)*10);
  ['headB','headBimg','pillS','pillImg','floorS','floorImg','dayS','dayImg','navS','navImg'].forEach(id=>$(id).style.visibility=(id.match(/day|nav/)?c:b)>0.001?'visible':'hidden');
  ['headA','headAimg','leftS','leftC','rightS','rightC'].forEach(id=>$(id).style.visibility=a>0.001?'visible':'hidden');

  /* navigation starts → background blur clears (stays clear while navigating) */
  $('bgSharp').style.opacity=eio(prog(t,T.f12Out[0],T.f3In[1]));

  /* drag circle during the scroll */
  const dOn=prog(t,T.scroll[0]-.15,T.scroll[0])*(1-prog(t,T.scroll[1],T.scroll[1]+.2));
  const dx=lerp(SCROLL_FROM.x,SCROLL_TO.x,k),dy=lerp(SCROLL_FROM.y,SCROLL_TO.y,k);
  $('drag').style.opacity=dOn;$('drag').style.transform=`translate(${dx}px,${dy}px)`;

  /* tap pulse */
  let tp=null;
  for(const [t0,p] of [[T.navTap,NAV_BTN],[T.pillTap,PILL]]){const q=prog(t,t0,t0+.45);if(t>=t0&&q<1)tp={p,o:1-q,s:.5+.7*q}}
  if(tp){$('tap').style.opacity=tp.o;$('tap').style.transform=`translate(${tp.p.x}px,${tp.p.y}px) scale(${tp.s})`}
  else $('tap').style.opacity=0;
}

function fit(){if(CAPTURE)return;const s=Math.min(innerWidth/1210,innerHeight/834);$('vp').style.transform=`scale(${s})`}
addEventListener('resize',fit);
async function boot(){
  await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  fit();apply(0);window.__ready=true;if(!CAPTURE)setTimeout(play,500);
}
window.__seek=t=>apply(t);window.__DUR=DUR;
let playing=false,t0=0,tNow=0;
function play(){playing=true;t0=performance.now()-tNow*1000;requestAnimationFrame(loop)}
function loop(now){if(!playing)return;tNow=(now-t0)/1000;if(tNow>=DUR){tNow=DUR;apply(DUR);playing=false;return}apply(tNow);requestAnimationFrame(loop)}
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(playing)playing=false;else{if(tNow>=DUR)tNow=0;play()}}
  if(e.key==='r'||e.key==='R'){tNow=0;apply(0);playing=false;setTimeout(play,400)}
});
boot();
</script>
</body>
</html>
