<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinplore Glass · Route</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#vp{position:relative;width:1210px;height:834px;overflow:hidden;flex:none;transform-origin:center;background:#7d7570}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
img{display:block}
.bg{position:absolute;width:1210px;height:834px;object-fit:none}
#bg{left:0;top:0;width:1210px;height:834px}  /* image 266, already cropped to the Figma iPad frame */
.glass{backdrop-filter:blur(26px) saturate(1.1);-webkit-backdrop-filter:blur(26px) saturate(1.1);background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 .7px rgba(255,255,255,.15)}
#headS{left:496px;top:31px;width:219px;height:64px;border-radius:999px;background:rgba(0,0,0,.3);backdrop-filter:blur(5.2px);-webkit-backdrop-filter:blur(5.2px);box-shadow:0 4px 21px rgba(0,0,0,.1)}
#head{left:496px;top:31px;width:219px;height:64px}

/* scene A: themes */
#sceneA{position:absolute;inset:0}
#row{position:absolute;left:0;top:0}
.theme{position:absolute;width:281px;height:281px;transform-origin:50% 50%}  /* image includes ~8% shadow margin */
.theme img{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit}
#create{left:367px;top:650px;width:475px;height:53px;border-radius:32.6px;background:rgba(255,255,255,.8);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);box-shadow:0 0 20px rgba(0,0,0,.08)}
#create img{width:475px;height:53px}

/* scene B: generated route */
#sceneB{position:absolute;inset:0}
#left{left:137px;top:123px;width:332px;height:658px;border-radius:28.7px;overflow:hidden}
#right{left:483px;top:123px;width:625px;height:658px;border-radius:24.2px;overflow:hidden}
.pos{position:absolute}
#map{left:0;top:65px;width:625px;height:286px}
#routeSvg{position:absolute;left:0;top:65px;width:625px;height:286px;overflow:visible}
#tl{position:absolute;left:19px;top:379px;width:26px;height:520px}
#tl i{position:absolute;left:12px;top:15px;width:1.2px;height:500px;background:rgba(255,255,255,.35)}
#tl b{position:absolute;left:0;width:26px;height:26px;border-radius:999px;background:#1c1c1c;color:#fff;font:800 12px/26px Montserrat,system-ui,sans-serif;text-align:center}
#fly{width:318px}
.touch{width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:999px;background:rgba(255,255,255,.35);
  border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.12),0 2px 10px rgba(0,0,0,.2);opacity:0;pointer-events:none;z-index:50}

@font-face{font-family:Manrope;font-weight:500;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:600;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
/* scene L: route being built (between theme pick and the generated route) */
#sceneL{position:absolute;inset:0;visibility:hidden}
#lcard{left:375px;top:279px;width:460px;height:276px;border-radius:28.7px;overflow:hidden;transform-origin:50% 50%}
#lcard .hd{position:absolute;left:116px;top:36px}
#lcard .tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.14);
  font:600 12px/1 Manrope,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.85)}
#lcard .tag i{width:6px;height:6px;border-radius:999px;background:#fff}
#lcard h2{margin-top:9px;font:700 23px/1.15 Montserrat,sans-serif;letter-spacing:-.3px;color:#fff;white-space:nowrap}
#lcard h2 span{display:inline-block;width:24px;text-align:left}
#steps{position:absolute;left:28px;top:128px;width:404px}
.st{display:flex;align-items:center;gap:12px;height:30px;font:600 15px/1 Manrope,sans-serif;color:#fff}
.st .ic{position:relative;width:20px;height:20px;flex:none}
.st .ic .ring{position:absolute;inset:0;border-radius:999px;border:2px solid rgba(255,255,255,.25)}
.st .ic .spin{position:absolute;inset:0;border-radius:999px;border:2px solid transparent;border-top-color:#fff;border-right-color:#fff}
.st .ic .ok{position:absolute;inset:0;border-radius:999px;background:#fff;opacity:0}
.st .ic .ok svg{position:absolute;inset:0}
.st .tx{transition:none}
#lbar{position:absolute;left:28px;right:28px;bottom:30px;height:5px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
#lbar i{display:block;height:100%;width:0;border-radius:999px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.45)}
#pick{left:0;top:0;transform-origin:0 0;z-index:5}

@font-face{font-family:Montserrat;font-weight:400;src:url(fonts/montserrat-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2) format("woff2")}
/* range wheel (Figma 2018:27360 → 2018:26937): 142×224 glass, 1.0km → 1.5km */
#range{left:42px;top:305.2px;width:142px;height:223.9px;border-radius:23.9px;overflow:hidden;
  background:rgba(0,0,0,.2);backdrop-filter:blur(23px);-webkit-backdrop-filter:blur(23px);box-shadow:inset 0 0 0 .6px rgba(255,255,255,.15)}
#range .ttl{position:absolute;left:0;right:0;top:19.1px;text-align:center;font:400 17.94px/22px Montserrat,sans-serif;color:#fff}
#range .chip{position:absolute;left:9.5px;top:109px;width:123px;height:47.8px;border-radius:11.9px;
  background:radial-gradient(ellipse at center,rgba(26,112,255,0) 22%,rgba(26,112,255,.08) 100%),rgba(255,255,255,.3);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 3.2px 15.9px rgba(0,0,0,.1)}
#range .chip i{position:absolute;left:17.5px;top:20.7px;width:6.3px;height:6.3px;border-radius:999px;background:#fff}
#range .rv{position:absolute;left:0;right:0;top:0;text-align:center;font-family:Montserrat,sans-serif;white-space:nowrap;transform-origin:50% 50%}
#range .rv.in{left:34.9px;right:auto;width:84px}
</style>
</head>
<body>
<div id="vp">
  <img id="bg" class="abs" src="assets/bg.jpg" alt="">

  <div id="sceneA">
    <div id="row"></div>
    <div id="range" class="abs"><div class="ttl">Range</div><div class="chip"><i></i></div><div id="rvals"></div></div>
    <div id="create" class="abs"><img src="assets/btnLabel.png" alt=""></div>
  </div>

  <div id="sceneL">
    <div id="lcard" class="abs glass">
      <div class="hd"><div class="tag"><i></i>Culture &amp; Art · 1.5km</div><h2 id="lt">Building your route<span id="dots"></span></h2></div>
      <div id="steps">
        <div class="st"><div class="ic"><i class="ring"></i><i class="spin"></i><i class="ok"><svg viewBox="0 0 20 20"><path d="M6 10.3l2.6 2.6L14.2 7.4" stroke="#1c1c1c" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i></div><span class="tx">Finding pins that match your theme</span></div>
        <div class="st"><div class="ic"><i class="ring"></i><i class="spin"></i><i class="ok"><svg viewBox="0 0 20 20"><path d="M6 10.3l2.6 2.6L14.2 7.4" stroke="#1c1c1c" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i></div><span class="tx">Checking opening hours</span></div>
        <div class="st"><div class="ic"><i class="ring"></i><i class="spin"></i><i class="ok"><svg viewBox="0 0 20 20"><path d="M6 10.3l2.6 2.6L14.2 7.4" stroke="#1c1c1c" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i></div><span class="tx">Connecting the best walking order</span></div>
      </div>
      <div id="lbar"><i id="lprog"></i></div>
    </div>
    <img id="pick" class="abs" src="assets/theme3.png" alt="">
  </div>

  <div id="sceneB">
    <div id="left" class="abs glass">
      <img id="leftHead" class="pos" src="assets/leftHead.png" style="left:-12px;top:-12px;width:352px" alt="">
      <img id="c0" class="pos" src="assets/card0.png" style="width:318px" alt="">
      <img id="c1" class="pos" src="assets/card1.png" style="width:318px" alt="">
      <img id="c2" class="pos" src="assets/card2.png" style="width:318px" alt="">
      <img id="c3" class="pos" src="assets/card3.png" style="width:318px" alt="">
    </div>
    <div id="right" class="abs glass">
      <img id="t5" class="pos" src="assets/title5.png" style="left:7px;top:12px;width:291px" alt="">
      <img id="t6" class="pos" src="assets/title6.png" style="left:7px;top:12px;width:292px;opacity:0" alt="">
      <img id="nb" class="pos" src="assets/navBtn.png" style="left:481px;top:7px;width:137px;transform-origin:50% 50%" alt="">
      <img id="map" class="pos" src="assets/map.png" alt="">
      <svg id="routeSvg" viewBox="0 0 625 286">
        <defs><mask id="pinHoles" maskUnits="userSpaceOnUse" x="-20" y="-20" width="665" height="326"><rect x="-20" y="-20" width="665" height="326" fill="#fff"/><circle cx="69" cy="85" r="15" fill="#000"/><circle cx="412.7" cy="25.3" r="12.5" fill="#000"/><circle cx="552.7" cy="75.7" r="12.5" fill="#000"/><circle cx="202.7" cy="128.7" r="12.5" fill="#000"/><circle cx="178.7" cy="204" r="12.5" fill="#000"/><circle cx="319.3" cy="260" r="12.5" fill="#000"/><circle cx="234" cy="25" r="15.5" fill="#000"/></mask><filter id="glow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <g mask="url(#pinHoles)"><g transform="translate(80.42 15.18)" filter="url(#glow)"><path id="r0" pathLength="1" d="M7.60852 71.5523L111.572 104.465C118.634 106.701 122.418 114.362 119.902 121.328L100.441 175.207C98.0589 181.8 101.316 189.097 107.816 191.726L227.153 239.999C233.96 242.752 241.698 239.345 244.262 232.465L324.92 16.0965C327.425 9.37846 334.883 5.9421 341.617 8.40347L467.337 54.3564" stroke="#fff" stroke-width="5.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
        <g transform="translate(60.86 4.24)" filter="url(#glow)"><path id="r1" pathLength="1" d="M7.60852 77.2068L52.012 90.1928C55.8041 91.3018 59.8946 90.6318 63.1348 88.3709L178.108 8.14727C180.387 6.55703 183.363 8.83216 182.426 11.4486L144.073 118.574L120 185.219C117.619 191.813 120.876 199.109 127.375 201.738L246.713 250.011C253.52 252.765 261.257 249.358 263.822 242.477L344.48 26.1088C346.985 19.3908 354.443 15.9544 361.177 18.4158L486.897 64.3688" stroke="#fff" stroke-width="5.7" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="0 1"/></g></g>
      </svg>
      <img id="pinsImg" class="pos" src="assets/pins.png" style="left:0;top:65px;width:625px" alt="">
      <img id="newPin" class="pos" src="assets/newPin.png" style="left:195.6px;top:51.6px;width:76.7px;opacity:0" alt="">
      <div id="tl"><i></i><b style="top:0">1</b><b id="tl2" style="top:217px">2</b></div>
      <img id="oldList" class="pos" src="assets/oldList.png" style="left:45px;top:369px;width:565px" alt="">
      <img id="newCard" class="pos" src="assets/newCard.png" style="left:45px;top:367px;width:565px;opacity:0" alt="">
    </div>
    <img id="fly" class="abs" src="assets/card0.png" alt="" style="opacity:0">
  </div>

  <div id="sceneC" style="position:absolute;inset:0;opacity:0;visibility:hidden">
    <img id="navBg" src="assets/navbg.jpg" class="abs" style="width:1210px;height:834px;transform-origin:50% 50%" alt="">
    <video id="navV" muted playsinline preload="auto" style="position:absolute;left:0;top:0;width:1210px;height:834px;object-fit:cover;transform-origin:50% 50%"><source src="assets/dogwalk.mp4" type="video/mp4"><source src="assets/dogwalk.webm" type="video/webm"></video>
    <div id="floorWrap" style="position:absolute;left:473px;top:543px;width:264px;height:245px;mix-blend-mode:screen">
      <img src="assets/floor.png" style="width:264px;height:245px;border-radius:25.45px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)" alt="">
    </div>
    <div style="position:absolute;left:469px;top:31px;width:63px;height:63px;border-radius:999px;background:rgba(0,0,0,.3);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)"></div>
    <img src="assets/head3.png" class="abs" style="left:469px;top:31px;width:63px;height:63px" alt="">
    <div id="pillC" style="position:absolute;left:542px;top:31px;height:63px;padding:0 24px 0 14px;display:flex;align-items:center;gap:8px;border-radius:999px;background:rgba(0,0,0,.3);
      backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:inset 0 0 0 .7px rgba(255,255,255,.15);font:600 19px/1 Montserrat,system-ui,sans-serif;color:#fff;white-space:nowrap">
      <img src="assets/pillIcon.png" style="width:28px;height:44px;object-fit:contain" alt="">Ceramic Face Wall<span style="font-weight:500;opacity:.7;margin-left:6px">2 min</span></div>
  </div>
  <div id="headS" class="abs"></div><img id="head" class="abs" src="assets/headRoute.png" alt="">
  <div id="tap" class="abs touch"></div>
  <div id="drag" class="abs touch"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eout=k=>1-Math.pow(1-k,3);
const back=k=>{const c=1.4;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const CAPTURE=new URLSearchParams(location.search).has('capture');
const tr=(el,x,y,extra='')=>{el.style.transform=`translate(${x}px,${y}px)${extra}`};

/* ---- scene A: theme carousel (Figma motion: row -17 → -343 → -637 → -969, focus card scales up) ---- */
const THEME_X=[0,371,686,1000,1315,1630], ROW=[-17,-343,-637,-969];
const HOLD0=2.3;                       // rest, set the range (1.0 → 1.5 km), then the carousel moves
const RANGE={spin:[1.0,1.75]}, RV=['0km','0.5km','1.0km','1.5km','2.0km','2.5km','3.0km'], RV0=2, RV1=3;
const STEPS=[[0.9,1.65],[1.85,2.6],[2.8,3.55]].map(([a,b])=>[a+HOLD0,b+HOLD0]);
const BOX=281, CARD=BOX, CAR_GAP=4;   // 281px images; each carries ~23px shadow margin, so visible card gaps ≈ 50px
const rvEls=RV.map(v=>{const e=document.createElement('div');e.className='rv';e.textContent=v;$('rvals').appendChild(e);return e});
const themes=THEME_X.map((x,i)=>{const d=document.createElement('div');d.className='theme';d.style.left='0px';d.style.top=(403.5-BOX/2)+'px';
  const im=document.createElement('img');im.src=`assets/theme${i}.png`;d.appendChild(im);$('row').appendChild(d);return d});
const A={in:[0,.5], tap:4.15+HOLD0, out:[4.45+HOLD0,4.85+HOLD0]};

/* ---- scene B: drag a pin card into the route (Figma motion, 6s, offset by B0) ---- */
/* ---- scene L: the chosen theme folds into a glass card while the route is built ---- */
const L0=4.5+HOLD0;
const L={fly:[0,.75], cardIn:[.25,.8], steps:[[.6,1.35],[1.35,2.0],[2.0,2.75]], draw:[.7,2.75], out:[3.0,3.45]};
const PICK_FROM={x:605-BOX*1.18/2,y:403.5-BOX*1.18/2,w:BOX*1.18}, PICK_TO={x:375+26,y:279+26,w:76};
const B0=L0+3.25;

const BI=1.0;                          // build-in: panels and their contents appear one by one
const B={in:[0,.12], hold:1.07+BI, fly:[1.39+BI,2.3+BI], land:2.3+BI, listUp:[1.35+BI,1.85+BI], shift:[1.75+BI,2.3+BI], expand:[2.3+BI,2.85+BI], oldOut:[2.57+BI,2.87+BI], title:[3.33+BI,3.62+BI], pin:[3.33+BI,3.73+BI], draw:[3.8+BI,4.65+BI], end:6.6+BI};
const POP={left:0, right:.08, leftHead:.18, c0:.26, c1:.34, c2:.42, c3:.5, t5:.22, nb:.3, map:.34, pins:.5, r0:[.56,.95], tl:.62, oldList:.68};
const pop=(tb,s)=>eout(prog(tb,s,s+.32));
const C0=B0+B.end-1.4;                 // tap Navigate after the new route is drawn
const C={tap:0, out:[.25,.7], in:[.4,.9], focus:[.4,1.6], ui:[1.3,1.8], end:4.8};
const DUR=C0+C.end;
const LIST=[0,266,393,613], CARD_FROM={x:158,y:196}, CARD_TO={x:537,y:502};

function apply(t){
  /* scene A */
  const aIn=eout(prog(t,...A.in)), aOut=prog(t,...A.out);
  $('sceneA').style.opacity=aIn*(1-aOut); $('sceneA').style.visibility=aOut<1?'visible':'hidden';
  let f=0; STEPS.forEach(([a,b])=>{f+=eio(prog(t,a,b))});

  /* range wheel: rows above/below shrink and fade (Figma: ±1 → 15.9px 50%, ±2 → 11.1px 20%) */
  const rv=lerp(RV0,RV1,eio(prog(t,...RANGE.spin))), CY=133;     // chip centre in the card
  rvEls.forEach((e,i)=>{const d=i-rv,a=Math.abs(d);
    const y=Math.sign(d)*(a<=1?35.9*a:35.9+24*(a-1));
    const fs=a<=1?lerp(19.83,15.87,a):lerp(15.87,11.11,Math.min(1,a-1));
    const op=a<=1?lerp(1,.5,a):a<=2?lerp(.5,.2,a-1):Math.max(0,lerp(.2,0,(a-2)/.6));
    const dark=a<.5; e.style.fontSize=fs+'px'; e.style.lineHeight='24px'; e.style.fontWeight=a<.5?700:500;
    e.style.color='#fff'; e.style.opacity=op; e.className='rv'+(a<.5?' in':'');
    e.style.transform=`translateY(${CY+y-12}px)`; e.style.visibility=a>2.6?'hidden':'visible';});
  /* focused card always sits at the screen centre; every gap between visible card edges stays CAR_GAP */
  const sc=themes.map((d,i)=>1+.18*clamp(1-Math.abs(i-f)));
  const cx=[0]; for(let i=1;i<themes.length;i++) cx.push(cx[i-1]+CARD*sc[i-1]/2+CAR_GAP+CARD*sc[i]/2);
  const fi=Math.min(Math.floor(f),themes.length-2), fk=f-fi, off=605-lerp(cx[fi],cx[fi+1],fk);
  themes.forEach((d,i)=>{const near=clamp(1-Math.abs(i-f));
    d.style.transform=`translate(${off+cx[i]-BOX/2}px,0) scale(${sc[i]})`;d.style.opacity=.5+.5*near;d.style.zIndex=Math.round(near*10)});
  $('create').style.transform=`scale(${1-.03*Math.sin(Math.PI*prog(t,A.tap,A.tap+.3))})`;

  /* scene L */
  const tl=t-L0, lIn=eout(prog(tl,...L.cardIn)), lOut=eio(prog(tl,...L.out));
  $('sceneL').style.visibility=(tl>=0&&lOut<1)?'visible':'hidden';
  const lc=$('lcard'); lc.style.opacity=lIn*(1-lOut);
  lc.style.transform=`scale(${lerp(.94,1,lIn)*lerp(1,1.04,lOut)})`; lc.style.filter=lOut>0?`blur(${12*lOut}px)`:'none';
  const pf=eio(prog(tl,...L.fly)), pw=lerp(PICK_FROM.w,PICK_TO.w,pf);
  const pk2=$('pick'); pk2.style.width=pk2.style.height=pw+'px';
  pk2.style.transform=`translate(${lerp(PICK_FROM.x,PICK_TO.x,pf)}px,${lerp(PICK_FROM.y,PICK_TO.y,pf)}px)`;
  pk2.style.opacity=(tl>=0?1:0)*(1-lOut); pk2.style.filter=lOut>0?`blur(${12*lOut}px)`:'none';
  document.querySelectorAll('#steps .st').forEach((el,i)=>{const [a,b]=L.steps[i];
    const act=tl>=a, done=tl>=b;
    el.querySelector('.tx').style.opacity=act?1:.45;
    el.querySelector('.spin').style.opacity=act&&!done?1:0; el.querySelector('.spin').style.transform=`rotate(${tl*400}deg)`;
    const ok=el.querySelector('.ok'); const ok2=prog(tl,b,b+.2); ok.style.opacity=ok2; ok.style.transform=`scale(${done?lerp(.6,1,ok2):.6})`;});
  $('lprog').style.width=(eio(prog(tl,.4,2.85))*100)+'%';
  $('dots').textContent=tl>=L.steps[2][1]?'':'.'.repeat(1+Math.floor((Math.max(0,tl)*3)%3));
  if(tl>=L.steps[2][1]) $('lt').firstChild.textContent='Your route is ready';
  else $('lt').firstChild.textContent='Building your route';

  /* scene B */
  const tb=t-B0;
  const bIn=eout(prog(tb,...B.in));
  $('sceneB').style.opacity=bIn; $('sceneB').style.visibility=bIn>0?'visible':'hidden';
  /* build-in */
  for(const id of ['left','right']){const k=pop(tb,POP[id]); $(id).style.opacity=k; $(id).style.transform=`translateY(${(1-k)*22}px) scale(${lerp(.96,1,k)})`}
  const pkI={}; for(const id of ['leftHead','c0','c1','c2','c3','t5','nb','map','pinsImg','tl','oldList']) pkI[id]=pop(tb,POP[id==='pinsImg'?'pins':id]);
  $('leftHead').style.opacity=pkI.leftHead; $('map').style.opacity=pkI.map; $('tl').style.opacity=pkI.tl; $('nb').style.opacity=pkI.nb;
  $('pinsImg').style.opacity=pkI.pinsImg; $('pinsImg').style.transform=`scale(${lerp(.9,1,pkI.pinsImg)})`; $('pinsImg').style.transformOrigin='50% 50%';
  const rIn=eio(prog(tb,...POP.r0));
  const up=-266*eio(prog(tb,...B.listUp));
  const col=eio(prog(tb,...B.listUp));
  LIST.forEach((y,i)=>{const el=$('c'+i),k=pkI['c'+i],dy=(1-k)*18; if(!i){tr(el,9,61+y+dy);el.style.clipPath=`inset(0 0 ${col*100}% 0 round 22px)`;el.style.opacity=k*(1-prog(tb,B.hold,B.hold+.22));} else {tr(el,9,61+y+up+dy);el.style.opacity=k}});
  // floating copy: lifted on pinch, carried to the itinerary
  const fk2=eio(prog(tb,...B.fly)), lift=prog(tb,B.hold,B.hold+.22);
  const fx=lerp(CARD_FROM.x,CARD_TO.x,fk2), fy=lerp(CARD_FROM.y,CARD_TO.y,fk2)-Math.sin(fk2*Math.PI)*40;
  $('fly').style.opacity=lift*(1-prog(tb,B.land-.1,B.land)); tr($('fly'),fx-9,fy-12,` scale(${1+.04*lift})`);
  // itinerary makes room, new card lands at the top
  const sh=eio(prog(tb,...B.shift));
  tr($('oldList'),0,-6.7+260*sh+(1-pkI.oldList)*18); $('oldList').style.opacity=pkI.oldList; tr($('tl2'),0,260*sh);
  const ex=eio(prog(tb,...B.expand)), nc=$('newCard');
  nc.style.opacity=prog(tb,B.land-.06,B.land+.02);
  nc.style.transform='none'; nc.style.clipPath=`inset(0 0 ${lerp(85,0,ex)}% 0 round 22px)`;
  // route regenerates
  $('r0').style.opacity=1-eio(prog(tb,...B.oldOut)); $('r0').setAttribute('stroke-dasharray',`${rIn} 1`); if(rIn<.002) $('r0').style.opacity=0;
  {const d1=eio(prog(tb,...B.draw)); $('r1').setAttribute('stroke-dasharray',`${d1} 1`); $('r1').style.opacity=d1<.002?0:1;}
  const ti=eio(prog(tb,...B.title)); $('t5').style.opacity=(1-ti)*pkI.t5; $('t6').style.opacity=ti;
  const pk=prog(tb,...B.pin); $('newPin').style.opacity=clamp(pk*1.6); $('newPin').style.transform=`scale(${pk<=0?0.6:pk<.6?lerp(.6,1.12,pk/.6):lerp(1.12,1,(pk-.6)/.4)})`;

  /* scene C: navigation to the first pin on the route */
  const tc=t-C0, cOut=eio(prog(tc,...C.out)), cIn=eout(prog(tc,...C.in));
  if(tc>0){ $('sceneB').style.opacity=bIn*(1-cOut); }
  const head=1-cOut; $('headS').style.opacity=head; $('head').style.opacity=head;
  $('sceneC').style.opacity=cIn; $('sceneC').style.visibility=cIn>0?'visible':'hidden';
  /* background pulls into focus: blur clears while the view zooms out to rest */
  const fz=eout(prog(tc,...C.focus)), ui=eout(prog(tc,...C.ui));
  $('navBg').style.filter=`blur(${lerp(22,0,fz)}px)`; $('navBg').style.transform=`scale(${lerp(1.18,1,fz)})`;
  $('navV').style.filter=$('navBg').style.filter; $('navV').style.transform=$('navBg').style.transform; vsync($('navV'),tc-(C.ui[1]-1.6));
  [...$('sceneC').children].forEach(el=>{if(el.id!=='navBg'&&el.id!=='navV') el.style.opacity=ui});
  $('floorWrap').style.transform=`translateY(${(1-ui)*14}px)`;
  $('nb').style.transform=`scale(${1-.04*Math.sin(Math.PI*prog(tc,C.tap,C.tap+.3))})`;

  /* touch indicators (only during actions) */
  const tp=$('tap'),dg=$('drag'); tp.style.opacity=0; dg.style.opacity=0;
  {const [a,b]=RANGE.spin; if(t>=a-.15&&t<b+.2){const k=eio(prog(t,a,b)); dg.style.opacity=prog(t,a-.15,a)*(1-prog(t,b,b+.2)); tr(dg,113,lerp(470,434,k));}}
  for(const [a,b] of STEPS){ if(t>=a-.15&&t<b+.2){const k=eio(prog(t,a,b)); dg.style.opacity=prog(t,a-.15,a)*(1-prog(t,b,b+.2)); tr(dg,lerp(760,520,k),402);} }
  const q=prog(t,A.tap,A.tap+.45); if(t>=A.tap&&q<1){tp.style.opacity=1-q;tr(tp,604,676,` scale(${.5+.7*q})`)}
  {const q=prog(t,C0,C0+.45); if(t>=C0&&q<1){tp.style.opacity=1-q;tr(tp,483+549,123+37,` scale(${.5+.7*q})`)}}
  if(tb>=B.hold-.1&&tb<B.land+.25){dg.style.opacity=prog(tb,B.hold-.1,B.hold)*(1-prog(tb,B.land,B.land+.25)); tr(dg,fx+150,fy+120);}
}
function fit(){if(CAPTURE)return;const s=Math.min(innerWidth/1210,innerHeight/834);$('vp').style.transform=`scale(${s})`}
addEventListener('resize',fit);
async function boot(){
  try{await Promise.all(['500 12px Manrope','600 12px Manrope','700 12px Montserrat','400 12px Montserrat','500 12px Montserrat'].map(f=>document.fonts.load(f)))}catch(e){}
  await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  fit();apply(0);window.__ready=true;if(!CAPTURE&&!/[?&]embed/.test(location.search))setTimeout(play,500);
}
window.__seek=t=>apply(t);window.__DUR=DUR;
let playing=false,t0=0,tNow=0;
/* footage preview: video streamed from Higgsfield, slaved to the flow clock (image stays underneath as fallback) */
function vsync(v,want){ if(!v||!v.duration)return; want=Math.max(0,Math.min(v.duration-.05,want));
  if(playing&&want>0&&want<v.duration-.05){ if(v.paused){v.currentTime=want;v.play().catch(()=>{})} else if(Math.abs(v.currentTime-want)>.25) v.currentTime=want; }
  else { if(!v.paused)v.pause(); if(Math.abs(v.currentTime-want)>.04) v.currentTime=want; } }

let raf=0;
function play(){cancelAnimationFrame(raf);playing=true;t0=performance.now()-tNow*1000;raf=requestAnimationFrame(loop)}
function loop(now){if(!playing)return;tNow=Math.max(0,(now-t0)/1000);if(tNow>=DUR){tNow=DUR;apply(DUR);playing=false;return}apply(tNow);raf=requestAnimationFrame(loop)}
/* shell control: the showcase drives playback in persistent frames */
window.__restart=()=>{playing=false;cancelAnimationFrame(raf);tNow=0;apply(0);play()};
window.__pause=()=>{playing=false;cancelAnimationFrame(raf);try{$('navV').pause()}catch(e){}};
window.__resume=()=>{if(!playing&&tNow<DUR)play()};
window.__t=()=>tNow;
/* fallback channel when the shell can't reach this frame directly (opened from file://) */
if(/[?&]embed/.test(location.search)){
  const st=document.createElement('style');st.textContent='#head,#headS,#headA,#headAimg{visibility:hidden!important}';document.head.appendChild(st);
  addEventListener('message',e=>{const c=e.data&&e.data.pp;if(c&&typeof window['__'+c]==='function')window['__'+c]()});
  setInterval(()=>{try{const h=document.getElementById('head')||document.getElementById('headA');
    parent.postMessage({ppT:tNow,ppDur:DUR,ppReady:!!window.__ready,ppHead:h&&h.style.opacity!==''?+h.style.opacity:1},'*')}catch(e){}},50);
}
boot();
</script>
